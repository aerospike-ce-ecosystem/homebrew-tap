name: formula-integrity
# What can actually go wrong in a Homebrew tap, checked on every change.
#
# This repo is what `brew install aerospike-ce-ecosystem/tap/ackoctl` reads, so
# a bad formula reaches users' machines directly. But the risk here is not the
# kind CodeQL looks for: Formula/*.rb is generated by goreleaser and contains no
# logic — only a URL, a checksum, and `bin.install` per platform. A CodeQL Ruby
# analysis of it runs 50 rules and finds nothing, by construction.
#
# What can go wrong is: a download URL pointing somewhere other than this org,
# a missing or malformed checksum, a version that disagrees with the URLs, or a
# hand edit replacing the generated file. Those are checked here.
#
# See aerospike-ce-ecosystem/project-hub#160.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a formula that was fine when merged is re-checked.
    - cron: '17 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formula-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify every formula
        run: |
          set -euo pipefail
          status=0

          shopt -s nullglob
          formulae=(Formula/*.rb)
          if [ ${#formulae[@]} -eq 0 ]; then
            echo "No formulae found under Formula/ — nothing to verify."
            exit 0
          fi

          for f in "${formulae[@]}"; do
            echo "=== $f ==="

            # 1. Still the generated artefact, not a hand-authored replacement.
            if ! grep -q "This file was generated by GoReleaser. DO NOT EDIT." "$f"; then
              echo "::error file=$f::missing the GoReleaser DO-NOT-EDIT header — was this hand-edited?"
              status=1
            fi

            # 2. Every download URL points at this organisation's releases.
            #    A URL anywhere else means the tap is serving someone else's binary.
            while read -r url; do
              case "$url" in
                https://github.com/aerospike-ce-ecosystem/*/releases/download/*)
                  echo "  url ok: $url" ;;
                *)
                  echo "::error file=$f::url is not an aerospike-ce-ecosystem release asset: $url"
                  status=1 ;;
              esac
            done < <(grep -oE '^[[:space:]]*url "[^"]+"' "$f" | sed -E 's/.*url "([^"]+)".*/\1/')

            # 3. One checksum per URL, each a well-formed SHA-256.
            n_url=$(grep -cE '^[[:space:]]*url "' "$f" || true)
            n_sha=$(grep -cE '^[[:space:]]*sha256 "' "$f" || true)
            if [ "$n_url" -ne "$n_sha" ]; then
              echo "::error file=$f::$n_url url(s) but $n_sha sha256(s) — every download must be checksum-pinned"
              status=1
            fi
            while read -r sha; do
              if ! printf '%s' "$sha" | grep -qE '^[0-9a-f]{64}$'; then
                echo "::error file=$f::malformed sha256: $sha"
                status=1
              fi
            done < <(grep -oE '^[[:space:]]*sha256 "[^"]+"' "$f" | sed -E 's/.*sha256 "([^"]+)".*/\1/')

            # 4. The declared version matches the tag every URL downloads from.
            version=$(grep -oE '^[[:space:]]*version "[^"]+"' "$f" | sed -E 's/.*version "([^"]+)".*/\1/' | head -1)
            if [ -n "$version" ]; then
              while read -r url; do
                if ! printf '%s' "$url" | grep -q "/download/v${version}/"; then
                  echo "::error file=$f::version \"$version\" does not match the tag in $url"
                  status=1
                fi
              done < <(grep -oE '^[[:space:]]*url "[^"]+"' "$f" | sed -E 's/.*url "([^"]+)".*/\1/')
            fi

            echo "  version=$version  urls=$n_url  sha256s=$n_sha"
          done

          if [ "$status" -eq 0 ]; then
            echo "All formulae verified."
          fi
          exit "$status"
